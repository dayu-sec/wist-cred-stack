test_envs:
  dep_root: ''
  deps: []

# 宿主 bind 挂载权限（`gops sys perms`）：
#   cred 以 999:999 运行，要写 `configs/cred/state`（凭据表 + 认证系统注册表 `peers.json`）。
#   web 是 nginx 官方镜像，默认 root，入口脚本会降权 —— 这里不声明，让它按默认走。
perms:
  services:
    cred:
      uid: 999
      gid: 999

# 密钥：入口 basic auth 的口令不从配置/环境里来，而是密钥文件（与 center / gateway 同一口径）。
#
#   .wist/sec-value.yml（**运维提供**、不入库、0600）
#     cred_web_password: "..."    # → 归一化为 SEC_CRED_WEB_PASSWORD
#
# `scripts/init-cred.sh` 在 localize 时用 `gops sec get` 读它、写成 `configs/web/htpasswd`
# （只有 apr1 摘要）；换口令 = 改密钥 + `gops sys localize`。
# 声明了就必须存在 —— 缺文件 / 缺键时 localize 直接失败，**不随机生成**（口令不落终端与 CI 日志）。
secrets:
  file: .wist/sec-value.yml
  format: yaml
  mode: "0600"

# `gops sys package` 打包时排除的路径（资源树里都是可重建 / 每部署一份的东西）。
ignore:
  - configs
  # 栈根密钥目录：密钥绝不进交付包。默认模式靠 `.gitignore` 挡住，
  # 这条是 **`--full` 模式的护栏**（WalkDir 不读 `.gitignore`）。
  - .wist

# 现场态：升级/重建时**不覆盖、也不删**。
protect:
  - .env
  - configs
  - .wist

# 对外契约：站点身份（入口服务器证书 + 私钥）是**不可重建**的现场事实，
# 丢了就得让所有人重新接受新证书。整目录进 contract。
contract:
  - identity

# 备份选取：渲染出的配置（含凭据表 state/ 与入口 htpasswd 的 apr1 摘要）。
# ⚠ 凭据表里**只有 sha256 摘要**，没有明文 —— 泄了也不能反推出 token；
#    但条目本身能看出"给谁发过什么权限"，所以仍然按运维资料对待。
# `.wist/sec-value.yml` 不进备份：丢了只需重设一个入口口令（htpasswd 随 configs 一起回放）。
backup:
  - configs
