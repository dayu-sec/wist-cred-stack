# wist-cred-stack —— 凭据服务（wist-cred）+ 管理页面（wist-cred-web）一站式编排。
#
# 拓扑（**只有一个宿主入口**）：
#
#      浏览器 / 内网反代
#            │ HTTPS（basic auth）
#            ▼
#        web（nginx，容器内 443）     ← 宿主发布 ${WEB_BIND_IP}:${WEB_HOST_PORT}
#            │ http://<cred>:8443    ← 只走专用 docker 网络
#            ▼
#        cred（wist-cred，容器内 8443）  ← **不对宿主发布任何端口**
#
# 为什么 cred 不发布端口：它的入站是 plain HTTP + peer IP 白名单（设计文档 S3），
# 只能由 web 到达；TLS 在 web 终止。两者在专用网段里固定 IP，`trusted_peers` 才写得住。
#
# 容器内端口/路径/服务名是**应用契约**，写死（8443/443）。
# 宿主端口与镜像 tag 才是变量，见 sys/setting/vars.yml 与 ops-prj 的 values/<系统名>/sys_value.yml。

services:
  # ── 凭据服务（C）──
  cred:
    container_name: wist-cred-stack-cred
    image: ${CRED_REGISTRY}/wist-cred:${CRED_IMAGE_TAG}
    # 与 center 同口径：运行身份 999:999，宿主侧由 `gops sys perms` 对齐 state 目录。
    user: "999:999"
    restart: unless-stopped
    environment:
      WIST_CRED_CONFIG: /wist-cred/wist-cred.toml
    volumes:
      # 运行配置：只有这一个文件挂在 /wist-cred，避免整目录可写。
      - ${CRED_CONFIG_DIR}/wist-cred.toml:/wist-cred/wist-cred.toml:ro
      # 凭据表（只存 sha256 摘要）：必须可写、必须持久。
      - ${CRED_CONFIG_DIR}/state:/wist-cred/state
      # 站点身份 + 推送用的 CA 信任锚（只读）
      - ./identity/cred:/wist-cred/identity:ro
    # **故意没有 ports**：只有 web 能到它。
    networks:
      crednet:
        ipv4_address: ${CRED_IP}

  # ── 入口（nginx：终止 TLS + 静态 + /api 反代 + 注入操作者头）──
  #
  # 镜像内不含站点配置：由 sys/configs/web/nginx.conf.tpl 渲染出 configs/web/nginx.conf，
  # 挂到 /etc/nginx/conf.d/default.conf。容器内 443 上跑 HTTPS。
  web:
    container_name: wist-cred-stack-web
    image: ${CRED_REGISTRY}/wist-cred-web:${CRED_WEB_IMAGE_TAG}
    restart: unless-stopped
    volumes:
      - ${WEB_NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ./identity/cred/server.crt:/certs/server.crt:ro
      - ./identity/cred/server.key:/certs/server.key:ro
      - ${WEB_HTPASSWD}:/etc/nginx/htpasswd:ro
    ports:
      - "${WEB_BIND_IP}:${WEB_HOST_PORT}:443"
    depends_on:
      - cred
    networks:
      crednet:
        ipv4_address: ${WEB_IP}

networks:
  crednet:
    name: wist-cred-stack-crednet
    driver: bridge
    ipam:
      config:
        - subnet: ${CRED_NET_SUBNET}
