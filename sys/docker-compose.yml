# wist-cred-stack —— 凭据服务（wist-cred）+ 管理页面（wist-cred-web）一站式编排。
#
# 拓扑（**只有一个宿主入口**）：
#
#      浏览器
#            │ HTTPS
#            ▼
#        web（nginx，容器内 443）     ← 宿主发布 ${WEB_BIND_IP}:${WEB_HOST_PORT}
#            │ 只做 TLS / 静态 / 反代（**不做认证**）
#            │ http://<cred>:8443    ← 只走专用 docker 网络
#            ▼
#        cred（wist-cred，容器内 8443）  ← **不对宿主发布任何端口**；页面口令在这里验
#
# 为什么 cred 不发布端口：它的入站是 plain HTTP + peer IP 白名单（设计文档 S3），
# 只能由 web 到达；TLS 在 web 终止。两者在专用网段里固定 IP，`trusted_peers` 才写得住。
#
# 容器内端口/路径/服务名是**应用契约**，写死（8443/443）。
# 宿主端口与镜像 tag 才是变量，见 sys/setting/vars.yml 与 ops-prj 的 values/<系统名>/sys_value.yml。

services:
  # ── 凭据服务（C）──
  cred:
    container_name: wist-cred-stack-cred
    image: ${CRED_REGISTRY}/wist-cred:${CRED_IMAGE_TAG}
    # 与 center 同口径：运行身份 999:999，宿主侧由 `gops sys perms` 对齐 state 目录。
    user: "999:999"
    restart: unless-stopped
    environment:
      WIST_CRED_CONFIG: /wist-cred/wist-cred.toml
      # 页面口令的来源：配置里写的是 `${SEC_CRED_WEB_PASSWORD}`，
      # 由 cred 加载时从这个密钥文件展开（与网关同一个做法），算成 sha256 后就丢掉明文。
      WIST_CRED_SEC_FILE: /secrets/sec-value.yml
    volumes:
      # 运行配置：只有这一个文件挂在 /wist-cred，避免整目录可写。
      - ${CRED_CONFIG_DIR}/wist-cred.toml:/wist-cred/wist-cred.toml:ro
      # 凭据表（只存 sha256 摘要）：必须可写、必须持久。
      - ${CRED_CONFIG_DIR}/state:/wist-cred/state
      # **逐个文件挂，不挂整个 identity/cred 目录**：cred 只需要这几样，
      # 而 `identity/cred` 里还躺着 ca-i.key（签 cred 自己身份的 CA 私钥）与站点私钥。
      - ./identity/cred/ca-s.crt:/wist-cred/identity/ca-s.crt:ro
      # CA-S 私钥：cred 是签发方（按 X 的 CSR 签它们的服务器证书），
      # 所以它必须能用到私钥——与 center 持 CA-G 私钥同构。只读、0600。
      - ./identity/cred/ca-s.key:/wist-cred/identity/ca-s.key:ro
      # CA-I 的**公开证书**：交给 X 当 client_ca（证明"来的是 cred"）。不含私钥。
      - ./identity/cred/ca-i.crt:/wist-cred/identity/ca-i.crt:ro
      - ./identity/cred/cred-client.crt:/wist-cred/identity/cred-client.crt:ro
      - ./identity/cred/cred-client.key:/wist-cred/identity/cred-client.key:ro
      # 部署态种子（每个 X 一个 `peer.json`，只读）。
      # 注册表本体在 ${CRED_CONFIG_DIR}/state/peers.json（可写）。
      - ./identity/cred/onboarding:/wist-cred/identity/onboarding:ro
      # 密钥文件（只读）：只有 `[server].admin_password` 的占位符向它要值。
      # 挂**目录**而非文件：源缺失时 Docker 只会建出 `.wist/` 目录，而不是把文件名建成目录。
      - ./.wist:/secrets:ro
    # **故意没有 ports**：只有 web 能到它。
    networks:
      crednet:
        ipv4_address: ${CRED_IP}

  # ── 入口（nginx：终止 TLS + 静态 + /api 反代）──
  #
  # 它**不做认证**：页面口令由页面自己输、由 cred 自己验（`mode = token`）。
  # nginx 只负责 TLS、静态产物与反代——权限处理不在这一层。
  #
  # 镜像内不含站点配置：由 sys/configs/web/nginx.conf.tpl 渲染出 configs/web/nginx.conf，
  # 挂到 /etc/nginx/conf.d/default.conf。容器内 443 上跑 HTTPS。
  web:
    container_name: wist-cred-stack-web
    image: ${CRED_REGISTRY}/wist-cred-web:${CRED_WEB_IMAGE_TAG}
    restart: unless-stopped
    volumes:
      - ${WEB_NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      - ./identity/cred/server.crt:/certs/server.crt:ro
      - ./identity/cred/server.key:/certs/server.key:ro
    ports:
      - "${WEB_BIND_IP}:${WEB_HOST_PORT}:443"
    depends_on:
      - cred
    networks:
      crednet:
        ipv4_address: ${WEB_IP}

  # ── 演示用验证方（可选，`COMPOSE_PROFILES=demo` 时才起）──
  #
  # 它不是 cred 的一部分，而是“另一个系统”：收 register/revoke、自己存摘要表、心跳。
  # 证书在 localize 阶段就签好了（SAN = 服务名），种子也写进了 onboarding/，
  # 所以它启动后**不需要**走一键接入 —— 那是给真机器用的。
  #
  # 摘要表放在容器内（不挂宿主）：重启会丢，正好用来演示 API 的“重推”。
  peer-demo:
    container_name: wist-cred-stack-peer-demo
    profiles: ["demo"]
    build:
      # 相对**项目目录**（gops 以栈根为 project-directory，与上面的 ./identity 一致）
      context: ./dev/peer-example
    image: wist-cred-peer-example:local
    restart: unless-stopped
    command:
      - --listen
      - 0.0.0.0:19443
      - --dir
      - /certs
      - --store
      - /data/state.json
      - --audience
      - ${CRED_DEMO_PEER}
      - --issuer
      - wist-cred
      - --known-roles
      - ${CRED_DEMO_PEER_ROLES}
      - --verify-endpoint
    volumes:
      # 宿主签好的服务器证书 + 本机私钥（只读）
      - ./identity/demo-peer:/certs:ro
      # cred 出示的客户端证书由 CA-I 签：它的公开证书就是这里的信任锚
      - ./identity/cred/ca-i.crt:/certs/client-ca.pem:ro
    depends_on:
      - cred
    networks:
      crednet:

networks:
  crednet:
    name: wist-cred-stack-crednet
    driver: bridge
    ipam:
      config:
        - subnet: ${CRED_NET_SUBNET}
