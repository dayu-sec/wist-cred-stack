# 系统级变量定义（system 段，仅非密钥配置）—— **产品默认值**
#
# ⚠ 现场值不要写在这里：写 ops-prj 的 `values/<系统名>/sys_value.yml`（它覆盖本文件，`gops sys localize` 即生效）。
#    改**本文件**才需要 `gops sys update`（并把 `sys/merged_vars.yml` 一起提交），否则不生效。
#
# 链路：本文件 → `gops sys update` → `sys/merged_vars.yml`（入库）
#       → `gops sys localize`（+ 合并 values/ 覆盖）→ 栈根 `.env` + `sys/configs/*.tpl` 渲染结果，
#       供 `sys/docker-compose.yml` 与 `scripts/*` 消费。
#
# 说明：
#   - 只有 `system:` 段的变量会进入 resolved_vars.yml 并最终导出到 .env；
#   - **密钥不走这里**：页面口令在栈根 `.wist/sec-value.yml`（`cred_web_password`），
#     配置模板里只写 `${SEC_CRED_WEB_PASSWORD}` 占位，cred 加载时自己展开并只留 sha256。
#     签发的 token 明文只在创建响应出现一次，库里只有 sha256 摘要（它不在本栈的文件里）。
system:
  # 镜像源前缀：国内走腾讯云 TCR，境外用 ghcr.io/dayu-sec
  # 产品默认是 ghcr；**现场值写 ops-prj 的 values/<系统名>/sys_value.yml**，不要改这里。
  - name: CRED_REGISTRY
    value: ghcr.io/dayu-sec
  - name: CRED_IMAGE_TAG
    value: v0.4.4-alpha
  - name: CRED_WEB_IMAGE_TAG
    value: v0.2.3-alpha
  # demo peer 的镜像 tag 是 `CRED_IMAGE_TAG` + `-example`（同一包名），不单列变量。

  # ── 演示用验证方（可选）──
  # 两个一起改，缺一个就不会起：
  #   CRED_DEMO_PEER    非空（如 peer-demo）→ localize 阶段给它签证书 + 写种子
  #   COMPOSE_PROFILES  demo             → compose 才把这个服务拉起来
  # 它用的是 **`wist-cred` 同一个镜像**（镜像里的 `wist-cred-example`），不需要额外构建。
  # 关掉时记得同时删 `identity/cred/onboarding/<name>/`，否则 cred 仍会把它当成一个系统。
  - name: CRED_DEMO_PEER
    value: ''
  - name: CRED_DEMO_PEER_ROLES
    value: read,investigation:run
  - name: COMPOSE_PROFILES
    value: ''

  # ── 网络：专用 bridge，两个容器固定 IP ──
  #
  # 为什么要固定：cred 的入站是 **plain HTTP + peer IP 白名单**（S3），
  # TLS 由 web 的 nginx 终止。它的 `trusted_peers` 只能写 web 的地址，
  # 所以两者都在这个专用网段里钉死 IP；cred **不对宿主发布任何端口**。
  - name: CRED_NET_SUBNET
    value: 172.28.90.0/24
  - name: CRED_IP
    value: 172.28.90.10
  - name: WEB_IP
    value: 172.28.90.11

  # ── 宿主入口：**只开 web 一个** ──
  # 浏览器 / 内网反代访问 web（443），web 再把 /api 转给 cred。
  # 默认只绑回环；内网开放时改成内网网卡 IP，**不要**改成 0.0.0.0。
  - name: WEB_BIND_IP
    value: 127.0.0.1
  - name: WEB_HOST_PORT
    value: 2444

  # 站点域名（服务器证书 SAN 要覆盖它）
  - name: WEB_DOMAIN
    value: cred.example.com

  # ── 挂载源 ──
  - name: CRED_CONFIG_DIR
    value: ./configs/cred
  # 入口 nginx 站点配置（localize 渲染物）
  - name: WEB_NGINX_CONF
    value: ./configs/web/nginx.conf

  # ── 签发上限 ──
  # ttl_seconds 超过这里的值会被静默压到上限。
  - name: CRED_MAX_TTL_SECONDS
    value: '2592000'          # 30d（脚本）
  - name: CRED_BREAK_GLASS_TTL_SECONDS
    value: '7776000'          # 90d
  - name: CRED_OVERLAP_SECONDS
    value: '300'              # 续期重叠窗口

  # ── 认证系统（验证方 X）────────────────────────────────────
  #
  # 注意：**这不是推送目标的配置项**。这里只是 "部署态种子"：
  # `scripts/gen-pki.sh` 按 `name=host` 写出 `identity/cred/onboarding/<name>/peer.json`，
  # cred 启动时**导入一次**到 `state/peers.json`；之后新增/改地址都走页面，不用重启。
  #
  # 第三个字段（`=https://…`）是该系统的收数地址：
  #   · 不给 = 只做手工分发（不推送、不心跳）；
  #   · 给了 = cred 把凭据摘要推过去，并按 heartbeat 周期探它的 /healthz。
  - name: CRED_PKI_PEERS
    value: wist-ingest=ingest.internal

  # 一次性接入券的有效期。上限 3600（加载期强制）。
  - name: CRED_ONBOARDING_TTL_SECONDS
    value: '900'
  # 签给每个验证方的服务器证书有效期（90d）。
  - name: CRED_PEER_CERT_TTL_SECONDS
    value: '7776000'
  # 心跳间隔（秒）；0 = 关闭。
  - name: CRED_HEARTBEAT_SECONDS
    value: '30'

  # 推送 / 心跳的单次请求超时（秒）。跨区部署（互联网区 → 计算区）链路慢时调大；
  # 调得太大会让一轮心跳拖住整个循环（心跳是串行探的）。
  - name: CRED_PUSH_TIMEOUT_SECONDS
    value: '10'

  # 时区（只影响容器内的本地时间戳：日志、心跳记录、页面展示）
  - name: TZ
    value: Asia/Shanghai
  # 时区数据落点：localize 阶段把宿主当前时区的 zone 文件复制到这里（容器只读挂载）。
  # 为什么不像其它栈那样直接挂宿主 /etc/localtime：见 scripts/init-timezone.sh 顶部。
  - name: TZ_RUNTIME_DIR
    value: ./configs/runtime/tz
